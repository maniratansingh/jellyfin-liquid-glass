<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ink Dissolved in Water - Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #040711;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Ink in water background container */
    .ink-background {
      position: fixed;
      inset: -10%;
      width: 120%;
      height: 120%;
      z-index: -1;
      background-color: #040711;
      background-image:
        radial-gradient(ellipse 65% 55% at 20% 20%, rgba(18, 65, 145, 0.42) 0%, transparent 68%),
        radial-gradient(ellipse 70% 60% at 80% 25%, rgba(68, 28, 110, 0.38) 0%, transparent 70%),
        radial-gradient(ellipse 60% 70% at 75% 80%, rgba(8, 110, 140, 0.32) 0%, transparent 65%),
        radial-gradient(ellipse 75% 65% at 15% 85%, rgba(20, 45, 115, 0.4) 0%, transparent 70%),
        radial-gradient(ellipse 85% 75% at 50% 50%, rgba(42, 20, 85, 0.28) 0%, transparent 75%);
      filter: blur(50px);
      -webkit-filter: blur(50px);
      transform: translate3d(0, 0, 0);
      animation: inkDrift 42s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .ink-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.02) 0%, transparent 60%),
        linear-gradient(180deg, rgba(4, 7, 17, 0.2) 0%, rgba(4, 7, 17, 0.6) 100%);
      pointer-events: none;
    }

    @keyframes inkDrift {
      0% {
        transform: scale(1) translate(0%, 0%) rotate(0deg);
      }
      33% {
        transform: scale(1.06) translate(3%, -2%) rotate(2deg);
      }
      66% {
        transform: scale(1.03) translate(-2%, 3%) rotate(-1.5deg);
      }
      100% {
        transform: scale(1.08) translate(1%, -1%) rotate(1deg);
      }
    }

    /* UI Content to test legibility */
    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 24px;
    }

    .glass-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(24px) saturate(1.5);
      -webkit-backdrop-filter: blur(24px) saturate(1.5);
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      margin-bottom: 48px;
    }

    .hero-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(30px) saturate(1.6);
      -webkit-backdrop-filter: blur(30px) saturate(1.6);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 40px;
      margin-bottom: 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1.5px 0.5px rgba(255, 255, 255, 0.3);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .glass-card {
      height: 260px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>
  <div class="ink-background"></div>
  <div class="ink-overlay"></div>

  <div class="container">
    <div class="glass-header">
      <div style="font-weight: 700; font-size: 1.1rem; letter-spacing: -0.02em;">Liquid Glass</div>
      <div style="display: flex; gap: 20px; font-size: 0.95rem; opacity: 0.85;">
        <span>Movies</span>
        <span>TV Shows</span>
        <span>Music</span>
      </div>
      <div style="width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.15);"></div>
    </div>

    <div class="hero-card">
      <h1 style="font-size: 2.8rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 12px;">Dune: Part Two</h1>
      <p style="font-size: 1.1rem; color: rgba(255, 255, 255, 0.7); max-width: 600px; line-height: 1.6; margin-bottom: 24px;">
        Paul Atreides unites with Chani and the Fremen while seeking revenge against the conspirators who destroyed his family.
      </p>
      <div style="display: inline-flex; align-items: center; gap: 10px; background: #007aff; color: #fff; padding: 12px 28px; border-radius: 999px; font-weight: 600; box-shadow: 0 4px 20px rgba(0, 122, 255, 0.4);">
        <span>&#9658; Play Movie</span>
      </div>
    </div>

    <div class="grid">
      <div class="glass-card"><div style="font-weight: 600;">Blade Runner 2049</div><div style="font-size: 0.85rem; color: rgba(255,255,255,0.6);">2017</div></div>
      <div class="glass-card"><div style="font-weight: 600;">Interstellar</div><div style="font-size: 0.85rem; color: rgba(255,255,255,0.6);">2014</div></div>
      <div class="glass-card"><div style="font-weight: 600;">Oppenheimer</div><div style="font-size: 0.85rem; color: rgba(255,255,255,0.6);">2023</div></div>
      <div class="glass-card"><div style="font-weight: 600;">Severance</div><div style="font-size: 0.85rem; color: rgba(255,255,255,0.6);">S1 &bull; 2022</div></div>
    </div>
  </div>
</body>
</html>
