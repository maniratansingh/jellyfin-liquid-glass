<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jellyfin Login Mock</title>
  <link rel="stylesheet" href="../../dist/jellyfin-liquid-glass.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b1524;
      background-image: url("https://wsrv.nl/?url=media.512pixels.net/downloads/macos-wallpapers-6k/26-Tahoe-Dark-6K.png&w=1080&output=webp&q=80");
      background-size: cover;
      background-position: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div id="loginPage" style="width: 100%;">
    <div class="padded-bottom-page">
      <div class="readOnlyContent">
        <form class="manualLoginForm">
          <h1 class="pageTitle">Please sign in</h1>
          <div class="inputContainer" style="margin-bottom: 16px;">
            <label style="display: block; font-size: 0.85rem; color: #86868b; margin-bottom: 6px;">User</label>
            <input type="text" class="emby-input" style="width: 100%; box-sizing: border-box; height: 44px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); padding: 0 16px; color: #fff;">
          </div>
          <div class="inputContainer" style="margin-bottom: 16px;">
            <label style="display: block; font-size: 0.85rem; color: #86868b; margin-bottom: 6px;">Password</label>
            <input type="password" class="emby-input" style="width: 100%; box-sizing: border-box; height: 44px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); padding: 0 16px; color: #fff;">
          </div>
          <div class="checkboxContainer" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <span>Remember Me</span>
            <input type="checkbox" checked style="width: 20px; height: 20px;">
          </div>
          <button type="submit" class="emby-button raised button-submit" style="width: 100%; height: 44px; border-radius: 999px; background: #007aff; color: #fff; border: none; font-weight: 600;">Sign In</button>
          <div style="text-align: center; margin-top: 16px;">
            <a href="#" style="color: #007aff; text-decoration: none; font-size: 0.9rem;">Forgot Password</a>
          </div>
        </form>
      </div>
      <div class="loginDisclaimerContainer" style="margin-top: 20px; text-align: center;">
        <div class="loginDisclaimer" style="font-size: 0.75rem; color: rgba(235,235,245,0.5); letter-spacing: 0.05em;">COWS & ELEPHANTS ONLY ALLOWED RESTRICTED ZONE</div>
      </div>
    </div>
  </div>
</body>
</html>
