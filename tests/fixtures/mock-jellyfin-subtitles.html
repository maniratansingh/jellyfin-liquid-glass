<!DOCTYPE html>
<html lang="en" class="layout-mobile" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, height=844, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mock Jellyfin Subtitles Preview</title>
  <link rel="stylesheet" href="../../dist/jellyfin-liquid-glass.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 844px;
      width: 390px;
      overflow: hidden;
    }
    .videoContainer {
      position: relative;
      width: 100%;
      height: 240px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .mockFrame {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.85;
      background: radial-gradient(circle at 50% 50%, #2b3a4a 0%, #0d131a 100%);
    }
  </style>
</head>
<body>
  <div class="videoContainer">
    <div class="mockFrame"></div>
    <div class="videoSubtitles">
      <div class="videoSubtitlesInner" style="font-size: 2.2em;">
        <span>...was not so that I could walk among that life.</span>
      </div>
    </div>
  </div>
</body>
</html>
